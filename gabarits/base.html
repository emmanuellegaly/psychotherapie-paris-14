<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{titre_seo}}</title>
<meta name="description" content="{{description}}">
<link rel="canonical" href="{{canonique}}">
{{robots}}<meta property="og:locale" content="fr_FR">
<meta property="og:site_name" content="{{site.nom_site}}">
<meta property="og:type" content="{{og_type}}">
<meta property="og:title" content="{{og_titre}}">
<meta property="og:description" content="{{description}}">
<meta property="og:url" content="{{canonique}}">
<meta property="og:image" content="{{og_image}}">
<meta property="og:image:width" content="{{og_image_l}}">
<meta property="og:image:height" content="{{og_image_h}}">
<meta property="og:image:alt" content="{{og_image_alt}}">
{{og_article}}<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#FDFCFA">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preload" href="/fonts/bodoni-moda-variable-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/albert-sans-variable-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/css/site.css?v={{version_css}}">
{{tete_page}}<script>document.documentElement.classList.add('js');</script>
<script src="/js/page.js?v={{version_js}}" defer></script>
{{jsonld}}
</head>
<body class="{{classe_corps}}">
<a class="lien-evitement" href="#contenu">Aller au contenu</a>
<!-- Barre de prise de rendez-vous : apparaît une fois le premier écran ou l’en-tête dépassé (js/page.js) -->
<div class="barre-rdv" id="barre-rdv" hidden>
  <div class="barre-rdv-ligne">
    <a class="barre-rdv-nom" href="/">{{site.nom}}</a>
    <a class="barre-rdv-tel" href="{{site.telephone_lien}}" aria-label="Appeler le {{site.telephone}}">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" d="M6.6 3.5h2.6l1.4 4.1-2 1.4a12 12 0 0 0 6.4 6.4l1.4-2 4.1 1.4v2.6c0 1-.8 1.8-1.8 1.8A15.9 15.9 0 0 1 4.8 5.3c0-1 .8-1.8 1.8-1.8z"/></svg>
      <span class="barre-rdv-numero">{{site.telephone}}</span><span class="barre-rdv-appeler">Appeler</span>
    </a>
    <a class="bouton bouton-petit" href="/prise-de-rendez-vous-en-ligne/">Prendre rendez-vous</a>
  </div>
</div>
{{entete}}
<main id="contenu" tabindex="-1">
{{principal}}
</main>
{{pied}}
</body>
</html>
